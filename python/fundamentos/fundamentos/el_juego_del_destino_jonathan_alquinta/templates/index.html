<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Juego del Destino</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="tarjeta">
        <header class="encabezado">
            <div class="badge-icono">🌙</div>
            <h1>El Juego del Destino</h1>
            <p>Descubre qué te depara el futuro</p>
        </header>

        <section class="cuerpo">
            <form action="{{ url_for('enviar') }}" method="POST">
                <div class="grupo-input">
                    <span class="icono-input">👤</span>
                    <input type="text" name="nombre" placeholder="Tu nombre" required>
                </div>

                <div class="grupo-input">
                    <span class="icono-input">📅</span>
                    <input type="number" name="edad" placeholder="Tu edad" min="1" max="120" required>
                </div>

                <div class="grupo-input">
                    <span class="icono-input">🎨</span>
                    <input type="text" name="color" placeholder="Tu color favorito" required>
                    <small>Ej. rojo, azul, verde, morado, amarillo...</small>
                </div>

                <div class="grupo-input">
                    <span class="icono-input">🐾</span>
                    <input type="text" name="animal" placeholder="Tu animal favorito" required>
                    <small>Ej. perro, gato, águila, león, delfín...</small>
                </div>

                <div class="bola-cristal">🔮</div>

                <button type="submit" class="btn-principal">✏️ Revelar mi destino</button>
            </form>
        </section>
    </div>
</body>
</html>
