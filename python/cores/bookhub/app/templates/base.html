<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body class="bg-light">
    {% if session.get('usuario_id') %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/libros">📖 BookHub</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/libros">Mis Libros</a>
                <a class="nav-link" href="/favoritos">Mis Favoritos</a>
            </div>
            <div class="navbar-nav">
                <span class="nav-item nav-link text-white me-3">Bienvenido, {{ session['nombre'] }}</span>
                <a class="btn btn-outline-light btn-sm" href="/cerrar_sesion">Cerrar Sesión</a>
            </div>
        </div>
    </nav>
    {% endif %}

    <div class="container">
        {% block contenido %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
