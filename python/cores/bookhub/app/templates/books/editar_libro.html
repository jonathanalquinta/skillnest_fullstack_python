{% extends 'base.html' %}
{% block contenido %}
<h2>Editar Libro</h2>

{% with msgs = get_flashed_messages(category_filter=['libro']) %}
    {% if msgs %}
        {% for msg in msgs %}
            <div class="alert alert-danger py-1">{{ msg }}</div>
        {% endfor %}
    {% endif %}
{% endwith %}

<form action="/libros/editar/{{ libro.id }}" method="POST" class="col-md-6 mt-3">
    <div class="mb-3">
        <label>Título:</label>
        <input type="text" name="titulo" class="form-control" value="{{ libro.titulo }}" required>
    </div>
    <div class="mb-3">
        <label>Autor:</label>
        <input type="text" name="autor" class="form-control" value="{{ libro.autor }}" required>
    </div>
    <div class="mb-3">
        <label>Género:</label>
        <select name="genero" class="form-select" required>
            <option value="Novela" {% if libro.genero == 'Novela' %}selected{% endif %}>Novela</option>
            <option value="Fábula" {% if libro.genero == 'Fábula' %}selected{% endif %}>Fábula</option>
            <option value="Ciencia Ficción" {% if libro.genero == 'Ciencia Ficción' %}selected{% endif %}>Ciencia Ficción</option>
            <option value="Romance" {% if libro.genero == 'Romance' %}selected{% endif %}>Romance</option>
            <option value="Desarrollo Personal" {% if libro.genero == 'Desarrollo Personal' %}selected{% endif %}>Desarrollo Personal</option>
        </select>
    </div>
    <div class="mb-3">
        <label>Fecha de publicación:</label>
        <input type="date" name="fecha_publicacion" class="form-control" value="{{ libro.fecha_publicacion }}" required>
    </div>
    <div class="mb-3">
        <label>Descripción:</label>
        <textarea name="descripcion" class="form-control" rows="4" required>{{ libro.descripcion }}</textarea>
    </div>
    <button type="submit" class="btn btn-dark">Actualizar</button>
    <a href="/libros" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
