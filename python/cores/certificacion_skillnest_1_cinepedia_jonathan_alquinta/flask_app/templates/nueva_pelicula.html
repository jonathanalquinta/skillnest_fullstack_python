<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CinePedia - Nueva Película</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Nueva Película</h1>
        <div>
            <a href="/cine" class="me-3">Inicio</a>
            <a href="/logout" class="text-danger">Cerrar Sesión</a>
        </div>
    </div>

    <!-- Errores de Validación (en rojo) -->
    {% with messages = get_flashed_messages(category_filter=['error']) %}
      {% if messages %}
        <div class="text-danger mb-3">
          {% for message in messages %}
            <p class="mb-1">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="/cine/crear" method="POST" class="col-md-6">
        <div class="mb-3">
            <label for="titulo" class="form-label">Nombre de Peli:</label>
            <input type="text" class="form-control" id="titulo" name="titulo" value="{{ session.get('draft_titulo', '') }}">
        </div>
        <div class="mb-3">
            <label for="director" class="form-label">Director:</label>
            <input type="text" class="form-control" id="director" name="director" value="{{ session.get('draft_director', '') }}">
        </div>
        <div class="mb-3">
            <label for="fecha_estreno" class="form-label">Fecha Estreno:</label>
            <input type="date" class="form-control" id="fecha_estreno" name="fecha_estreno" value="{{ session.get('draft_fecha_estreno', '') }}">
        </div>
        <div class="mb-3">
            <label for="sinopsis" class="form-label">Sinopsis:</label>
            <textarea class="form-control" id="sinopsis" name="sinopsis" rows="4">{{ session.get('draft_sinopsis', '') }}</textarea>
        </div>
        <button type="submit" class="btn btn-secondary">Guardar Película</button>
    </form>
</body>
</html>
