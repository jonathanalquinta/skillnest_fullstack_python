<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CinePedia - Editar Película</title>
    <!-- Estilos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">

    <!-- Encabezado y enlaces de navegación -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Editar Película</h1>
        <div>
            <a href="/cine" class="btn btn-link">Inicio</a>
            <a href="/logout" class="btn btn-link text-danger">Cerrar Sesión</a>
        </div>
    </div>

    <!-- Mensajes de error flash -->
    {% with messages = get_flashed_messages(category_filter=['error']) %}
      {% if messages %}
        <div class="text-danger mb-3">
          {% for message in messages %}
            <p class="m-0">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Formulario de edición (reutiliza 'draft' si hay error de validación o 'pelicula' como valor original) -->
    <form action="/cine/actualizar/{{ pelicula.id }}" method="POST" class="col-md-6">
        <div class="mb-3">
            <label for="titulo" class="form-label">Nombre de Peli:</label>
            <input type="text" class="form-control" id="titulo" name="titulo" value="{{ draft['titulo'] if draft else pelicula.titulo }}">
        </div>
        <div class="mb-3">
            <label for="director" class="form-label">Director:</label>
            <input type="text" class="form-control" id="director" name="director" value="{{ draft['director'] if draft else pelicula.director }}">
        </div>
        <div class="mb-3">
            <label for="fecha_estreno" class="form-label">Fecha Estreno:</label>
            <input type="date" class="form-control" id="fecha_estreno" name="fecha_estreno" value="{{ draft['fecha_estreno'] if draft else pelicula.fecha_estreno }}">
        </div>
        <div class="mb-3">
            <label for="sinopsis" class="form-label">Sinopsis:</label>
            <textarea class="form-control" id="sinopsis" name="sinopsis" rows="4">{{ draft['sinopsis'] if draft else pelicula.sinopsis }}</textarea>
        </div>
        <button type="submit" class="btn btn-outline-dark">Guardar Película</button>
    </form>

</body>
</html>
