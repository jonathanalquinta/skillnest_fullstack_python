<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CinePedia - Registro e Inicio de Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1 class="mb-4">CinePedia</h1>
    
    <!-- Mensajes de Error y Validación -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category == 'error' else 'info' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="row mt-4">
        <!-- Formulario de Registro -->
        <div class="col-md-6 pe-4 border-end">
            <h2>Registro</h2>
            <form action="/registro" method="POST">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                </div>
                <div class="mb-3">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input type="text" class="form-control" id="apellido" name="apellido" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Conf. Contraseña</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                </div>
                <button type="submit" class="btn btn-primary">Registrar</button>
            </form>
        </div>

        <!-- Formulario de Inicio de Sesión -->
        <div class="col-md-6 ps-4">
            <h2>Inicio de Sesión</h2>
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label for="login_email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="login_email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="login_password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="login_password" name="password" required>
                </div>
                <button type="submit" class="btn btn-success">Iniciar Sesión</button>
            </form>
        </div>
    </div>
</body>
</html>
