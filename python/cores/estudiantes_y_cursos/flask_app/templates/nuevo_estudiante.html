{% extends "base.html" %}

{% block title %}
Nuevo Estudiante
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card shadow-sm">

            <div class="card-body">

                <h1 class="h3 mb-4">
                    Nuevo Estudiante
                </h1>


                <form
                    action="{{ url_for('crear_estudiante') }}"
                    method="POST"
                >


                    <!-- CURSO -->

                    <div class="mb-3">

                        <label
                            for="curso_id"
                            class="form-label"
                        >
                            Curso
                        </label>


                        <select
                            id="curso_id"
                            name="curso_id"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Selecciona un curso
                            </option>


                            {% for curso in cursos %}

                                <option
                                    value="{{ curso.id }}"
                                >
                                    {{ curso.nombre }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- NOMBRE -->

                    <div class="mb-3">

                        <label
                            for="nombre"
                            class="form-label"
                        >
                            Nombre
                        </label>


                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            class="form-control"
                            required
                        >

                    </div>


                    <!-- APELLIDO -->

                    <div class="mb-3">

                        <label
                            for="apellido"
                            class="form-label"
                        >
                            Apellido
                        </label>


                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            class="form-control"
                            required
                        >

                    </div>


                    <!-- EDAD -->

                    <div class="mb-4">

                        <label
                            for="edad"
                            class="form-label"
                        >
                            Edad
                        </label>


                        <input
                            type="number"
                            id="edad"
                            name="edad"
                            class="form-control"
                            min="1"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Crear
                    </button>


                    <a
                        href="{{ url_for('cursos') }}"
                        class="btn btn-outline-secondary"
                    >
                        Inicio
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
